name: Eventora CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventora_user
          POSTGRES_PASSWORD: eventora_secure_pass
          POSTGRES_DB: eventora_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run lint

      - name: Run Concurrency & Unit Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://eventora_user:eventora_secure_pass@localhost:5432/eventora_db?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-32-chars-long-here
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-long-here

      - name: Build Frontend and Server
        run: npm run build

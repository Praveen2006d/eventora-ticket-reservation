version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventora-postgres
    restart: always
    environment:
      POSTGRES_USER: eventora_user
      POSTGRES_PASSWORD: eventora_secure_pass
      POSTGRES_DB: eventora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventora_user -d eventora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventora-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: eventora-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://eventora_user:eventora_secure_pass@postgres:5432/eventora_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: eventora-access-secret-development-key-change-in-production-256bit
      JWT_REFRESH_SECRET: eventora-refresh-secret-development-key-change-in-production-256bit
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: eventora-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://eventora_user:eventora_secure_pass@postgres:5432/eventora_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: eventora-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
